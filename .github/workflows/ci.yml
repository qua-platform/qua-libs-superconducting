name: ci

# CI runs black on the non-QCA tree, builds the calibration package, and
# pytest for both repo-root checks and the calibration suite.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: black --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: uvx --from "black>=24.3,<25" black --check --diff .

  changelog:
    name: changelog
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changelog
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_main_changelog.py --base-sha "$BASE_SHA"

  test-repo:
    name: pytest (repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest tests -q

  build-package:
    name: build calibration package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qualibration_graphs/superconducting
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist + wheel
        # Validates packaging (catches missing/renamed package dirs, bad readme
        # paths, etc.)
        run: uv build

  test:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: qualibration_graphs/superconducting
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --python 3.14
      - name: Run tests
        run: uv run pytest -q

  qua-compile:
    name: qua compile (calibration nodes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qualibration_graphs/superconducting
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --python 3.14
      - name: Compile QUA programs
        run: uv run pytest tests/test_qua_compile.py -q

  qca-migration-gates:
    name: QCA migration grep gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout qua-libs-core kit
        uses: actions/checkout@v4
        with:
          repository: JacobFastQM/qua-libs-core
          ref: QL-1212-qua141-py314
          path: .qua-libs-core
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workspace dependencies
        run: uv sync --python 3.14
      - name: Run portable QCA migration gates
        env:
          QCA_MODALITY: Superconducting
          QCA_REPO: ${{ github.workspace }}
        run: uv run pytest .qua-libs-core/qua141_migration/tests/test_qca_migration_gates.py -q
