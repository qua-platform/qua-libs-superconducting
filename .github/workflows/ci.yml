name: ci

# Baseline CI: black formatting gate (mirrors the original qua-libs check),
# adapted to uv. The per-repo [tool.black] config in pyproject.toml controls
# scope -- this repo excludes the legacy Quantum-Control-Applications tree.
# Build/test of the installable sub-packages is added separately.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: black --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: uvx --from "black>=24.3,<25" black --check --diff .

  build-package:
    name: build calibration package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qualibration_graphs/superconducting
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist + wheel
        run: uv build

  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qualibration_graphs/superconducting
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --python 3.14
      - name: Run tests
        run: uv run pytest -q

  qua-compile:
    name: qua compile (calibration nodes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qualibration_graphs/superconducting
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: uv sync --python 3.14
      - name: Compile QUA programs
        run: uv run pytest tests/test_qua_compile.py -q

  qca-migration-gates:
    name: QCA migration grep gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout qua-libs-core kit
        uses: actions/checkout@v4
        with:
          repository: JacobFastQM/qua-libs-core
          ref: QL-1212-qua141-py314
          path: .qua-libs-core
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workspace dependencies
        run: uv sync --python 3.14
      - name: Run portable QCA migration gates
        env:
          QCA_MODALITY: Superconducting
          QCA_REPO: ${{ github.workspace }}
        run: uv run pytest .qua-libs-core/qua141_migration/tests/test_qca_migration_gates.py -q
