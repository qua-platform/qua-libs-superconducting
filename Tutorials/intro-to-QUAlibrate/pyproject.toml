# Intro-to-QUAlibrate tutorial: a runnable example, not an installable package.
# `package = false` means `uv sync` builds an environment from the deps below
# without trying to build or publish the tutorial. (Previously this file was a
# mis-copy of the calibration package's pyproject — same name, wrong packages.)

[project]
name = "intro-to-qualibrate"
version = "0"
description = "Introductory QUAlibrate tutorial (superconducting)"
readme = "readme.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "qualang-tools>=0.19.0",
    "qualibrate>=1.5.0",
    "qm-qua==2.0.0.dev5",
    "qua-libs-core@git+https://github.com/qua-platform/qua-libs-core.git",
    "quam-builder",
    "qualibration-libs@git+https://github.com/qua-platform/qualibration-libs.git",
]

[tool.uv]
package = false

[tool.uv.sources]
qm-qua = { path = "../../qua2-wheels/qm_qua-2.0.0.dev5-py3-none-any.whl" }
# Must match the quam-builder tag that qualibration-libs pins, or uv reports conflicting URLs.
quam-builder = { git = "https://github.com/qua-platform/quam-builder.git", tag = "v0.5.0" }

[dependency-groups]
dev = ["ipykernel>=7.0.0a1", "pytest>=8.3.5"]

[tool.black]
line-length = 120
