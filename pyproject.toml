# qua-libs-superconducting: QCA examples, tutorials, and calibration graphs.
#
# This is the uv workspace root. A single `uv sync` here creates one .venv with
# dependencies for Quantum-Control-Applications and qualibration_graphs.
#
# The calibration package remains a workspace member with its own pyproject.toml
# for hatch build metadata (calibrations, quam_config, calibration_utils).

[project]
name = "qua-libs-superconducting"
version = "0"
description = "Superconducting-transmon QUA libraries, calibration graphs, and examples"
license = { file = "LICENSE" }
authors = [{ name = "Quantum Machines", email = "info@quantum-machines.co" }]
requires-python = ">=3.10,<3.15"
dependencies = [
    "qm-qua==2.0.0.dev19",
    "qua-evaluator==1.0.4",
    "qop-models==0.1.2",
    "qualang-tools>=0.19.0",
    "qua-libs-core@git+https://github.com/JacobFastQM/qua-libs-core.git",
    "numpy>=1.18.5",
    "scipy>=1.7.0",
    "matplotlib>=3.2.2",
    "plotly>=5.24.1",
    "superconducting-calibrations",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "codeartifact"
url = "https://quantum-machines-439440158105.d.codeartifact.us-east-1.amazonaws.com/pypi/qm-pypi/simple/"
explicit = true

[tool.uv.sources]
superconducting-calibrations = { workspace = true }
qua-libs-core = { git = "https://github.com/JacobFastQM/qua-libs-core.git" }
qm-qua = { index = "codeartifact" }
qua-evaluator = { path = "qua2-wheels/qua_evaluator-1.0.4-py3-none-any.whl" }
qop-models = { path = "../qop-models" }

[tool.uv.workspace]
members = ["qualibration_graphs/superconducting"]

[dependency-groups]
dev = ["black>=24.3,<25", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
# qua2-wheels/test_code.py is a vendored demo script (not a test suite) that happens to
# match pytest's `test_*.py` collection pattern; it imports qua_emulator, which is no
# longer a dependency now that the harness uses qua-evaluator. Ignore the whole
# wheel-bundle directory rather than editing vendor content.
addopts = "--ignore=qua2-wheels"

[tool.black]
line-length = 120
extend-exclude = "Quantum-Control-Applications"

[tool.ruff]
line-length = 120
extend-exclude = ["Quantum-Control-Applications"]

[tool.ruff.lint]
ignore = ["F403", "F405", "E741"]
