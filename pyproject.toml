# qua-libs-superconducting is a collection of QUA examples and sub-packages,
# not an installable package itself. `package = false` is the uv-native
# equivalent of the original qua-libs Poetry `package-mode = false`.
#
# The dependencies below are the common runtime stack used by the loose QCA /
# Tutorials scripts (derived from their imports), so `uv sync` gives a runnable
# environment for those.
#
# The calibration graphs are a separate installable sub-package with their own,
# fuller dependency set (including git deps quam-builder / qualibration-libs):
#   qualibration_graphs/superconducting/  (superconducting-calibrations)
# Niche per-use-case deps under Quantum-Control-Applications (e.g. qiskit, cirq)
# are intentionally NOT pulled into this root.

[project]
name = "qua-libs-superconducting"
version = "0"
description = "Superconducting-transmon QUA libraries, calibration graphs, and examples"
license = { file = "LICENSE" }
authors = [{ name = "Quantum Machines", email = "info@quantum-machines.co" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "qm-qua>=1.2.0",
    "qualang-tools>=0.19.0",
    "qua-libs-core@git+https://github.com/qua-platform/qua-libs-core.git",
    "numpy>=1.18.5",
    "scipy>=1.7.0",
    "matplotlib>=3.2.2",
    "plotly>=5.24.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["black>=24.3,<25", "ruff>=0.6,<1"]

[tool.black]
line-length = 120
# Legacy Quantum-Control-Applications use-case code is not formatted and is left
# out of the formatting gate (it is contributed example code, kept as-is).
extend-exclude = "Quantum-Control-Applications"

[tool.ruff]
line-length = 120
# Match black: keep the legacy QCA tree out of linting too.
extend-exclude = ["Quantum-Control-Applications"]

[tool.ruff.lint]
# `from qm.qua import *` is the idiomatic QUA style (F403/F405); single-letter
# names like I/Q/l are standard in physics code (E741). Ignoring these keeps
# ruff's output useful. Run locally with: uv run ruff check .
ignore = ["F403", "F405", "E741"]
